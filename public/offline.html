<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1f3a" />
    <title>Offline · ZamLine</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 24px 16px;
        place-items: center;
        background: #f2f9fd;
        color: #0b1f3a;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 12px;
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border: 1px solid #d7e5ea;
        border-radius: 16px;
        background: #ffffff;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 4px 0 0;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #445867;
        font-size: 16px;
        line-height: 1.6;
      }
      a {
        margin-top: 8px;
        padding: 12px 24px;
        border-radius: 10px;
        background: #0b1f3a;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="ZamLine" />
      <h1>You are offline</h1>
      <p>Check your internet connection, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
